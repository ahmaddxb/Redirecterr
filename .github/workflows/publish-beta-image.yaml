name: Publish beta image to GitHub Container Registry

on:
  release:
    types: [prereleased]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish_beta_image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch beta image
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository }}"
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)

          TAG_ARGS="-t ${IMAGE_NAME}:beta -t ${IMAGE_NAME}:beta-sha-${SHORT_SHA}"
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG_ARGS="$TAG_ARGS -t ${IMAGE_NAME}:${{ github.event.release.tag_name }}"
          fi

          docker buildx create --use
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --cache-from type=gha,scope=beta \
            --cache-to type=gha,mode=max,scope=beta \
            $TAG_ARGS \
            --push .